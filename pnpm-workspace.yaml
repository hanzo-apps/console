# pnpm settings for this app. There is no workspace here — console is one package —
# but pnpm reads its settings from this file, so this is where they live.

# pnpm does not run a dependency's install scripts unless it is named here. These
# two genuinely need to build and the app does not work without them: esbuild ships
# a platform binary that vitest and Next invoke, and sharp is the image codec Next
# optimizes with. Anything not listed stays inert, which is the point — a new
# transitive dependency cannot run code at install time just by arriving.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm refuses packages published in the last few days, so a compromised release has
# to survive a cooling-off period before it can reach a build. That default is worth
# keeping for the registry at large and actively wrong for our own scopes: we publish
# @hanzo/ui and consume it the same hour.
#
# Excluding by SCOPE rather than by version is load-bearing. Pinning `@hanzo/ui@8.0.11`
# is what pnpm writes on its own, and it rewrites this file on every bump — which
# makes a --frozen-lockfile install in CI mutate the tree and fail. A scope glob is
# stable, so the file stays put and CI stays deterministic.
minimumReleaseAgeExclude:
  - '@hanzo/*'
  - '@hanzogui/*'

# Install scripts run only for packages listed here.
allowBuilds:
  esbuild: true
  sharp: true

# Our own scopes skip pnpm's new-release quarantine. Scope glob, not a version
# pin: pnpm rewrites version entries on every bump and breaks --frozen-lockfile.
minimumReleaseAgeExclude:
  - '@hanzo/*'
  - '@hanzogui/*'

# One version of a package, or the app ships two copies of it. React Native's
# colour normalizer arrives at two versions through two RN lineages; it is a
# pure function table, so the newer one serves both.
overrides:
  '@react-native/normalize-colors': 0.83.2

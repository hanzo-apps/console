[mcp_servers.langfuse-docs]
url = "https://langfuse.com/api/mcp"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--isolated",
  "--save-session",
  "--output-dir",
  "/tmp/playwright-mcp",
  "--test-id-attribute",
  "data-testid",
]

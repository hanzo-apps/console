name: Build Docker Image
# Builds + pushes ghcr.io/hanzoai/console2 on main / dispatch, on the self-hosted
# ARC runner. ONE brand-agnostic image serves every brand: console2 resolves the
# brand at RUNTIME from the request hostname (console.hanzo.ai → hanzo,
# console.lux.cloud → lux, console.zoo.cloud → zoo; src/config/index.ts), and /v1
# is same-origin per host. So NO NEXT_PUBLIC_* are baked — baking them would pin the
# image to one brand. Tags: :sha-<sha7> + :latest.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/hanzoai/console2:sha-${{ steps.sha.outputs.short }}
            ghcr.io/hanzoai/console2:latest

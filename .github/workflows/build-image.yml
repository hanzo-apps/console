name: Build Docker Image
# Builds + pushes ghcr.io/hanzoai/console2 on main / dispatch, on the self-hosted
# ARC runner. NEXT_PUBLIC_* are baked at build time, so each env gets its own
# image: push to main / dispatch(mainnet) -> :sha-+:latest; dispatch(devnet) ->
# :dev; dispatch(testnet) -> :test. Hosts follow svc.env.hanzo.ai (mainnet =
# console2.hanzo.ai, the current console host).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Target env"
        type: choice
        options: [mainnet, testnet, devnet]
        default: mainnet

concurrency:
  group: docker-image-${{ github.ref }}-${{ github.event.inputs.env || 'mainnet' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Compute per-env config
        id: cfg
        run: |
          ENV="${{ github.event.inputs.env || 'mainnet' }}"
          case "$ENV" in
            devnet)
              echo "console_url=https://console.dev.hanzo.ai" >> "$GITHUB_OUTPUT"
              echo "iam_url=https://iam.dev.hanzo.ai"          >> "$GITHUB_OUTPUT"
              echo "billing_url=https://billing.dev.hanzo.ai"  >> "$GITHUB_OUTPUT"
              echo "tags=ghcr.io/hanzoai/console2:dev"         >> "$GITHUB_OUTPUT" ;;
            testnet)
              echo "console_url=https://console.test.hanzo.ai" >> "$GITHUB_OUTPUT"
              echo "iam_url=https://iam.test.hanzo.ai"         >> "$GITHUB_OUTPUT"
              echo "billing_url=https://billing.test.hanzo.ai" >> "$GITHUB_OUTPUT"
              echo "tags=ghcr.io/hanzoai/console2:test"        >> "$GITHUB_OUTPUT" ;;
            *)
              echo "console_url=https://console2.hanzo.ai"     >> "$GITHUB_OUTPUT"
              # Canonical issuer is hanzo.id (iss=https://hanzo.id, which the cloud
              # /v1 backend validates). NEXT_PUBLIC_IAM_URL is inlined at build time,
              # so this is what the browser uses for the authorize redirect — it must
              # be hanzo.id, NOT iam.hanzo.ai (legacy zone, iss mismatch → drops sign-in).
              echo "iam_url=https://hanzo.id"                  >> "$GITHUB_OUTPUT"
              echo "billing_url=https://billing.hanzo.ai"      >> "$GITHUB_OUTPUT"
              echo "tags=ghcr.io/hanzoai/console2:sha-${GITHUB_SHA::7}"$'\n'"ghcr.io/hanzoai/console2:latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.cfg.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_CLOUD_URL=${{ steps.cfg.outputs.console_url }}
            NEXT_PUBLIC_IAM_URL=${{ steps.cfg.outputs.iam_url }}
            NEXT_PUBLIC_IAM_APP_NAME=hanzo-cloud
            NEXT_PUBLIC_IAM_ORG_NAME=hanzo
            NEXT_PUBLIC_IAM_CLIENT_ID=hanzo-cloud
            NEXT_PUBLIC_BILLING_URL=${{ steps.cfg.outputs.billing_url }}

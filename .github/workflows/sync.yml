name: Sync to Hanzo Git
# Tells git.hanzo.ai a push happened. It runs ZERO CI.
#
# This is now the only file here, as the law says. cicd.yml moved to
# `.hanzo/workflows/` verbatim (a 7-line caller over hanzo.yml, so nothing else
# changed) and the hand-rolled buildctl in `.hanzo/workflows/deploy.yml` retired
# into it.
#
# What blocked that move was never the code: hanzoai/console is a Gitea pull
# mirror and had the Actions UNIT disabled (`mirror: true, has_actions: false`,
# zero runs ever), so nothing under `.hanzo/workflows` could execute. Enabling
# the unit is the whole unblock — a pull-mirror sync does fire Actions
# (hanzoai/git: services/mirror/mirror_pull.go calls notify_service.
# SyncPushCommits, and services/actions/notifier.go turns that into a run), so
# converting the mirror to canonical is a separate question about who owns main,
# not a precondition for CI.
#
# The cost of getting that order wrong is on the record: build-image.yml was
# neutralized on 2026-07-24 in favour of a native pipeline that could not run,
# and v8.5.23 / 8.5.24 shipped no image at all.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: sync-to-hanzo-git
  cancel-in-progress: true
jobs:
  nudge:
    # OUR pool, not ubuntu-latest: GitHub-hosted minutes are billing-blocked for
    # this org ("The job was not started because recent account payments have
    # failed or your spending limit needs to be increased" — measured on this
    # repo, 2026-07-25). One bounded curl on the build pool always runs; a
    # GitHub-hosted one is a coin flip on the invoice.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 5
    steps:
      - name: Tell git.hanzo.ai to pull main now
        env:
          # Instance token for git.hanzo.ai (repo secret; the value lives in KMS
          # at hanzo/prod:/git/admin-token). Absent ⇒ the timer tick still syncs.
          HANZO_GIT_TOKEN: ${{ secrets.HANZO_GIT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HANZO_GIT_TOKEN:-}" ]; then
            echo "HANZO_GIT_TOKEN unset — native sync picks this push up on its next tick."
            exit 0
          fi
          # git.hanzo.ai's own software API is /api/v1 (upstream forge surface,
          # kept verbatim) — our /v1-only law governs Hanzo services, not this host.
          if curl -fsS --max-time 20 --retry 2 --retry-delay 3 -X POST \
               -H "Authorization: token ${HANZO_GIT_TOKEN}" \
               -H "Content-Type: application/json" \
               "https://git.hanzo.ai/api/v1/repos/hanzoai/console/actions/workflows/sync-from-github.yml/dispatches" \
               -d '{"ref":"main"}'; then
            echo "native sync dispatched — build runs on our runners"
          else
            echo "dispatch failed (non-fatal) — the 10-minute timer tick converges"
          fi

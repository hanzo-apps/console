# ~7-line canonical caller — all real config lives in /hanzo.yml.
# Builds + pushes the console-embed artifact on OUR arc pool; auto-mirrors to
# registry.hanzo.ai. The Next.js server image stays in build-image.yml.
name: CI/CD
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    with:
      # hanzo-build-linux-amd64 arc pool wedged (empty-image drift + dup listener,
      # runners churn Pending w/o consuming jobs). Route to the healthy deploy pool
      # so the console-embed artifact rebuilds. Revert once hanzo-build is repaired.
      runner: '["hanzo-deploy-linux-amd64"]'
    secrets: inherit

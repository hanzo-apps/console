name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "test"
      - "dev"
    tags:
      - "v*"
  merge_group:
  pull_request:
    branches:
      - "**"

env: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep the test job node-version matrices in sync. GitHub does not allow the
  # env context in jobs.<job_id>.name, so matrix jobs use matrix.node-version
  # for their display names.
  NODE_VERSION: 24
  DATASTORE_CLIENT_VERSION: "25.12.9.61"

  # Disable CI cache restores for fork PRs.
  #
  # Fork PRs can only read base-branch caches, and CI cache paths must not
  # contain secrets. This is conservative defense-in-depth, not required for
  # release cache integrity: PR-created caches are scoped to the PR merge ref,
  # main does not restore them, and release image builds intentionally do not
  # restore CI caches.
  CI_CACHE_ALLOWED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  pre-job:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      llm_connections_changed: ${{ steps.filter.outputs.llm_connections }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Replaces fkirc/skip-duplicate-actions — skips runs whose git tree
      # was already tested in a prior successful run of this workflow.
      - id: skip_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TREE=$(gh api "repos/$REPOSITORY/git/commits/$COMMIT_SHA" --jq '.tree.sha')

          MATCH=$(gh api "repos/$REPOSITORY/actions/workflows/pipeline.yml/runs?status=success&per_page=20" \
            | jq -r --argjson run_id "$RUN_ID" --arg current_tree "$CURRENT_TREE" \
              '[.workflow_runs[] | select(.id != $run_id and .head_commit.tree_id == $current_tree)] | first | .head_sha // empty')

          if [[ -n "$MATCH" ]]; then
            echo "::notice::Tree $CURRENT_TREE already tested in a prior successful run (commit $MATCH) — skipping"
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Recommended for paths-filter action
          # may save additional git fetch roundtrip if
          # merge-base is found within latest N commits
          fetch-depth: 20
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            llm_connections:
              - 'packages/shared/package.json'
              - 'packages/shared/src/server/llm/fetchLLMCompletion.ts'

  # ──────────────────────────────────────────────────────────────────────
  # Build once, share via artifact — eliminates 7 redundant builds
  # ──────────────────────────────────────────────────────────────────────
  build:
    runs-on: [self-hosted, linux, amd64]
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.3
      - name: Use Node.js ${{ env.NODE_VERSION }} without cache
        if: env.CI_CACHE_ALLOWED != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Use Node.js ${{ env.NODE_VERSION }} with pnpm cache
        if: env.CI_CACHE_ALLOWED == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] lint job dependency cache only; no released artifacts are built or published from this cached state
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: install dependencies
        run: pnpm install
      - name: Load default env
        run: |
          cp .env.dev.example .env
          # Enable init scripts in the build — test jobs need the seed to run
          sed -i 's/NEXT_PUBLIC_HANZO_RUN_NEXT_INIT="false"/NEXT_PUBLIC_HANZO_RUN_NEXT_INIT="true"/' .env
      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
      - name: Package build artifact
        run: |
          tar cf /tmp/build-artifact.tar \
            .turbo \
            packages/shared/prisma/generated \
            packages/shared/dist \
            packages/datastore/dist \
            packages/langchain/dist \
            packages/console-js/dist \
            web/.next \
            worker/dist \
            2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: /tmp/build-artifact.tar
          retention-days: 1
          compression-level: 1

  # ──────────────────────────────────────────────────────────────────────
  # Lint + Prettier — merged into one job
  # ──────────────────────────────────────────────────────────────────────
  lint:
    runs-on: hanzo-build-linux-amd64
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.3
      - name: Use Node.js ${{ env.NODE_VERSION }} without cache
        if: env.CI_CACHE_ALLOWED != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Use Node.js ${{ env.NODE_VERSION }} with pnpm cache
        if: env.CI_CACHE_ALLOWED == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] prettier check dependency cache only; no released artifacts are built or published from this cached state
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: install dependencies
        run: pnpm i
      - name: Load default env
        run: cp .env.dev.example .env
      - name: lint web
        run: pnpm run lint
      - name: Check formatting on changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA=$(git merge-base origin/main HEAD)
          fi

          echo "Checking files changed from $BASE_SHA to HEAD"

          if git diff --quiet --exit-code --diff-filter=d "$BASE_SHA" HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.css'; then
            echo "No JS/TS/CSS files changed - skipping prettier check"
          fi

  # ──────────────────────────────────────────────────────────────────────
  # Test jobs — all download shared build artifact
  # ──────────────────────────────────────────────────────────────────────
  test-docker-build:
    timeout-minutes: 20
    runs-on: [self-hosted, linux, amd64]
    continue-on-error: true # not in CI gate — stabilizing Docker build
    needs:
      - pre-job
    if: needs.pre-job.outputs.should_skip != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Ensure Docker Compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p "$DOCKER_CONFIG/cli-plugins"
            curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
              -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
            chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          fi
          docker compose version
      - name: Login to Docker Hub
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_READ }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ }}
      - name: Set NEXT_PUBLIC_BUILD_ID
        run: echo "NEXT_PUBLIC_BUILD_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build and run both images from compose
        run: |
          docker compose --progress plain --verbose -f docker-compose.build.yml build --print > /tmp/bake.json
          docker buildx bake -f /tmp/bake.json
          docker compose --progress plain -f docker-compose.build.yml up -d --wait --wait-timeout 300
      - name: Ensure all services are healthy
        run: |
          docker compose -f docker-compose.build.yml ps
          if docker compose -f docker-compose.build.yml ps | grep -E "(unhealthy|Exit)"; then
            echo "One or more services are unhealthy or exited"
            docker compose -f docker-compose.build.yml logs
            exit 1
          else
            # --experimental-cli is intentionally omitted: its glob resolver treats bracket characters
            # in Next.js dynamic-route paths (e.g. [projectId]) as glob character classes, causing
            # "No files matching the given patterns were found" (exit 123) for any PR that touches a
            # file inside a bracket-named directory. Standard prettier resolves explicit paths correctly.
            # Parallelism and the ephemeral cache (the only extras --experimental-cli adds) provide no
            # benefit when checking a handful of per-PR changed files.
            git diff --name-only -z --diff-filter=d "$BASE_SHA" HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' \
              | xargs -0 --no-run-if-empty pnpm prettier --check --
          fi
      - name: Check worker health
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3030/api/health; do sleep 2; done'
      - name: Check server health
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:3000/api/public/health; do sleep 3; done'
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.build.yml logs --tail=200

  tests-web-sync:
    timeout-minutes: 15
    runs-on: [self-hosted, linux, amd64]
    needs:
      - pre-job
      - build
    if: needs.pre-job.outputs.should_skip != 'true'
    name: tests-web-sync (node${{ matrix.node-version }}, pg${{ matrix.postgres-version }})
    strategy:
      matrix:
        node-version: [24]
        postgres-version: [18]
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install golang-migrate with Datastore driver
        run: |
          curl -L https://github.com/hanzoai/migrate/releases/download/v4.19.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/migrate
          which migrate
      - uses: pnpm/action-setup@v6
        with:
          version: 9.5.0
      - name: Login to Docker Hub
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_READ }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Use Node.js ${{ env.NODE_VERSION }} with pnpm cache
        if: env.CI_CACHE_ALLOWED == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] eslint-plugin test dependency cache only; no published artifacts are built from this cached state
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: install dependencies
        run: pnpm install
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: /tmp
      - name: Extract build artifact
        run: tar xf /tmp/build-artifact.tar
      - name: Load default env
        run: |
          grep -v -e '^S3_BATCH_EXPORT_ENABLED=' -e '^NEXT_PUBLIC_HANZO_RUN_NEXT_INIT=' .env.dev.example > .env
          echo "HANZO_INGESTION_QUEUE_DELAY_MS=1" >> .env
          echo "HANZO_CACHE_PROMPT_ENABLED=false" >> .env
          echo "HANZO_INGESTION_DATASTORE_WRITE_INTERVAL_MS=1" >> .env
      - name: Ensure Docker Compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p "$DOCKER_CONFIG/cli-plugins"
            curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
              -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
            chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          fi
          docker compose version
      - name: Run dev containers
        run: |
          docker compose -f docker-compose.dev.yml up -d --wait
          docker compose ps
        env:
          POSTGRES_VERSION: ${{ matrix.postgres-version }}
      - name: Migrate DB
        run: |
          pnpm run db:migrate
          pnpm --filter=shared ds:up
        env:
          DATASTORE_MIGRATION_URL: datastore://localhost:9000
          DATASTORE_URL: http://localhost:8123
          DATASTORE_USER: hanzo
          DATASTORE_PASSWORD: hanzo
          DATASTORE_DB: default
      - name: Create datastore-client wrapper (uses running container)
        run: |
          printf '#!/bin/bash\nshift\nexec docker exec -i hanzo-datastore datastore client "$@"\n' | sudo tee /usr/local/bin/datastore-client
          sudo chmod +x /usr/local/bin/datastore-client
          datastore-client client --user hanzo --password hanzo -q "SELECT 'wrapper-ok'" | grep -q wrapper-ok
      - name: Setup Dev Tables
        run: |
          pnpm --filter=shared ds:dev-tables
        env:
          DATASTORE_MIGRATION_URL: datastore://localhost:9000
          DATASTORE_URL: http://localhost:8123
          DATASTORE_USER: hanzo
          DATASTORE_PASSWORD: hanzo
          DATASTORE_DB: default
      - name: Verify Dev Tables
        run: |
          docker exec hanzo-datastore datastore client --user hanzo --password hanzo -q "SHOW TABLES" | tee /dev/stderr | grep -q events
      - name: Copy standalone static assets
        run: |
          WEB_SERVER=$(find web/.next/standalone -name 'server.js' -path '*/web/server.js' -not -path '*/node_modules/*' | head -1)
          STANDALONE_WEB_DIR=$(dirname "$WEB_SERVER")
          cp -r web/.next/static "$STANDALONE_WEB_DIR/.next/static"
          cp -r web/public "$STANDALONE_WEB_DIR/public" 2>/dev/null || true
          echo "Static assets copied to $STANDALONE_WEB_DIR"
      - name: Start Hanzo
        run: |
          WEB_SERVER=$(find web/.next/standalone -name 'server.js' -path '*/web/server.js' -not -path '*/node_modules/*' | head -1)
          echo "Starting standalone server: $WEB_SERVER"
          npx dotenv -e .env -- sh -c "HOSTNAME=0.0.0.0 NEXT_MANUAL_SIG_HANDLE=true node $WEB_SERVER" > /tmp/web.log 2>&1 &
          npx dotenv -e .env -- sh -c "HOSTNAME=0.0.0.0 node worker/dist/index.js" > /tmp/worker.log 2>&1 &
        env:
          INIT_ORG_ID: "seed-org-id"
          INIT_ORG_NAME: "Seed Org"
          INIT_ORG_CLOUD_PLAN: "Team"
          INIT_PROJECT_ID: "7a88fb47-b4e2-43b8-a06c-a5ce950dc53a"
          INIT_PROJECT_NAME: "Seed Project"
          INIT_PROJECT_PUBLIC_KEY: "pk-hz-1234567890"
          INIT_PROJECT_SECRET_KEY: "sk-hz-1234567890"
          INIT_USER_EMAIL: "demo@hanzo.ai"
          INIT_USER_NAME: "Demo User"
          INIT_USER_PASSWORD: "password"
      - name: Wait for server and seed data
        run: |
          echo "Waiting for server health..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000/api/public/health; do sleep 2; done' || {
            echo "Web server health check failed. Web logs:"; cat /tmp/web.log || true; exit 1
          }
          echo "Server healthy. Waiting for seed data..."
          timeout 60 bash -c 'until docker exec hanzo-postgres psql -U postgres -d postgres -tAc "SELECT count(*) FROM projects WHERE id = '\''7a88fb47-b4e2-43b8-a06c-a5ce950dc53a'\''" 2>/dev/null | grep -q "^1$"; do sleep 2; done' || {
            echo "Seed data not found. Web logs:"; cat /tmp/web.log || true; exit 1
          }
          echo "Seed data verified."
      - name: run test-sync
        working-directory: web
        run: npx cross-env NODE_OPTIONS='--no-experimental-require-module' npx dotenv -e ../.env.test -e ../.env -- npx jest --verbose --runInBand --detectOpenHandles --forceExit --selectProjects sync-server
      - name: run test-client
        working-directory: web
        run: npx cross-env NODE_OPTIONS='--no-experimental-require-module' npx dotenv -e ../.env.test -e ../.env -- npx jest --verbose --runInBand --detectOpenHandles --forceExit --selectProjects client

  tests-web-async:
    timeout-minutes: 15
    runs-on: [self-hosted, linux, amd64]
    needs:
      - pre-job
      - build
    if: needs.pre-job.outputs.should_skip != 'true'
    name: tests-web-async (node${{ matrix.node-version }}, pg${{ matrix.postgres-version }}, shard${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        postgres-version: [18]
        deploy-mode: [""]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install golang-migrate with Datastore driver
        run: |
          curl -L https://github.com/hanzoai/migrate/releases/download/v4.19.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/migrate
          which migrate
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.3
      - name: Login to Docker Hub
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_READ }}
          password: ${{ secrets.DOCKERHUB_TOKEN_READ }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: install dependencies
        run: pnpm install
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: /tmp
      - name: Extract build artifact
        run: tar xf /tmp/build-artifact.tar
      - name: Load default env
        run: |
          grep -v -e '^S3_BATCH_EXPORT_ENABLED=' -e '^NEXT_PUBLIC_HANZO_RUN_NEXT_INIT=' .env.dev${{ matrix.deploy-mode }}.example > .env
          echo "HANZO_INGESTION_QUEUE_DELAY_MS=1" >> .env
          echo "HANZO_INGESTION_DATASTORE_WRITE_INTERVAL_MS=1" >> .env
          echo "HANZO_TRACE_DELETE_CONCURRENCY=100" >> .env
          echo "ADMIN_API_KEY=admin-api-key" >> .env
          echo "HANZO_EE_LICENSE_KEY=hanzo_ee_test" >> .env
      - name: Ensure Docker Compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p "$DOCKER_CONFIG/cli-plugins"
            curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
              -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
            chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          fi
          docker compose version
      - name: Run dev containers
        run: |
          docker compose -f docker-compose.dev${{ matrix.deploy-mode }}.yml up -d --wait
          docker compose ps
        env:
          POSTGRES_VERSION: ${{ matrix.postgres-version }}
      - name: Migrate DB
        run: |
          pnpm run db:migrate
          pnpm --filter=shared ds:up
        env:
          DATASTORE_MIGRATION_URL: datastore://localhost:9000
          DATASTORE_URL: http://localhost:8123
          DATASTORE_USER: hanzo
          DATASTORE_PASSWORD: hanzo
          DATASTORE_DB: default
      - name: Create datastore-client wrapper (uses running container)
        if: matrix.deploy-mode == ''
        run: |
          printf '#!/bin/bash\nshift\nexec docker exec -i hanzo-datastore datastore client "$@"\n' | sudo tee /usr/local/bin/datastore-client
          sudo chmod +x /usr/local/bin/datastore-client
          datastore-client client --user hanzo --password hanzo -q "SELECT 'wrapper-ok'" | grep -q wrapper-ok
      - name: Setup Dev Tables
        if: matrix.deploy-mode == ''
        run: |
          pnpm --filter=shared ds:dev-tables
      - name: Verify Dev Tables
        if: matrix.deploy-mode == ''
        run: |
          docker exec hanzo-datastore datastore client --user hanzo --password hanzo -q "SHOW TABLES" | tee /dev/stderr | grep -q events
      - name: Copy standalone static assets
        run: |
          WEB_SERVER=$(find web/.next/standalone -name 'server.js' -path '*/web/server.js' -not -path '*/node_modules/*' | head -1)
          STANDALONE_WEB_DIR=$(dirname "$WEB_SERVER")
          cp -r web/.next/static "$STANDALONE_WEB_DIR/.next/static"
          cp -r web/public "$STANDALONE_WEB_DIR/public" 2>/dev/null || true
          echo "Static assets copied to $STANDALONE_WEB_DIR"
      - name: Start Hanzo
        run: |
          WEB_SERVER=$(find web/.next/standalone -name 'server.js' -path '*/web/server.js' -not -path '*/node_modules/*' | head -1)
          echo "Starting standalone server: $WEB_SERVER"
          npx dotenv -e .env -- sh -c "HOSTNAME=0.0.0.0 NEXT_MANUAL_SIG_HANDLE=true node $WEB_SERVER" > /tmp/web.log 2>&1 &
          npx dotenv -e .env -- sh -c "HOSTNAME=0.0.0.0 node worker/dist/index.js" > /tmp/worker.log 2>&1 &
        env:
          INIT_ORG_ID: "seed-org-id"
          INIT_ORG_NAME: "Seed Org"
          INIT_ORG_CLOUD_PLAN: "Team"
          INIT_PROJECT_ID: "7a88fb47-b4e2-43b8-a06c-a5ce950dc53a"
          INIT_PROJECT_NAME: "Seed Project"
          INIT_PROJECT_PUBLIC_KEY: "pk-hz-1234567890"
          INIT_PROJECT_SECRET_KEY: "sk-hz-1234567890"
          INIT_USER_EMAIL: "demo@hanzo.ai"
          INIT_USER_NAME: "Demo User"
          INIT_USER_PASSWORD: "password"
      - name: Wait for server and seed data
        run: |
          echo "Waiting for server health..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000/api/public/health; do sleep 2; done' || {
            echo "Web server health check failed. Web logs:"; cat /tmp/web.log || true; exit 1
          }
          echo "Server healthy. Waiting for seed data..."
          timeout 60 bash -c 'until docker exec hanzo-postgres psql -U postgres -d postgres -tAc "SELECT count(*) FROM projects WHERE id = '\''7a88fb47-b4e2-43b8-a06c-a5ce950dc53a'\''" 2>/dev/null | grep -q "^1$"; do sleep 2; done' || {
            echo "Seed data not found. Web logs:"; cat /tmp/web.log || true; exit 1
          }
          echo "Seed data verified."
      - name: run tests
        working-directory: web
        run: npx cross-env NODE_OPTIONS='--no-experimental-require-module' npx dotenv -e ../.env.test -e ../.env -- npx jest --verbose --runInBand --detectOpenHandles --forceExit --selectProjects async-server --shard=${{ matrix.shard }}/3

  tests-worker:
    timeout-minutes: 20
    runs-on: [self-hosted, linux, amd64]
    needs:

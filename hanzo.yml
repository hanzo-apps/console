# CI config for hanzo-apps/console — read by hanzoai/ci (build) and platform (deploy).
#
# The console is a static SPA and ships ONE way: as the active release of the
# `hanzo-console` site, which cloud reads from S3 at boot and on poll (the site:
# block below publishes it). console.hanzo.ai comes from that release, so rolling
# the standalone Deployment reaches nobody. The `console` image serves the same
# bundle behind hanzoai/static for the white-label admin hosts.
#
# TAGS: the builder publishes `sha-<sha7>-amd64` on every main push and the bare
# semver on a cut v* tag. Pin the semver in a universe values file — it says which
# console RELEASE a deployment carries, which a sha cannot. A cut tag is never
# re-pointed; cut the next patch instead.
images:
  - name: console
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/console
    # Fetched from KMS (deploy/PUBLISHABLE_KEY, env prod) and passed as
    # --build-arg PUBLISHABLE_KEY. Signed-out views need it to be admitted; signed-in
    # ones carry their own bearer.
    build_secrets: [PUBLISHABLE_KEY]

# The site publish — what reaches console.hanzo.ai. Without this block the site step
# skips and a console change lands on main but never ships. slug is cloud's
# CLOUD_CONSOLE_SITE default; dir is what the build emits; the publish reads
# HANZO_DEPLOY_TOKEN from KMS (kms.org below), so a missing credential FAILS the
# publish rather than shipping empty. On main only.
#
# The export no longer travels as one request, so the 16 MiB edge ceiling recorded
# above it no longer bounds a release: each file goes straight to object storage
# against a presigned grant. That ceiling is what a per-route export met at 627
# files and 116 MB, and it is no longer the reason not to have one.
#
# build runs on a FRESH runner checkout with no node_modules, so it installs first,
# and it uses pnpm — the packageManager this repo pins (npm would fetch a stray
# next and fail). Same steps the Dockerfile runs, so the runner export matches the
# image bundle byte-for-byte.
#
# That match includes the ingest key, and it is why NEXT_PUBLIC_PUBLISHABLE_KEY is
# spelled here. KMS holds the one plain name, PUBLISHABLE_KEY, and each lane maps it
# to the name the bundler inlines: the image lane in the Dockerfile (ARG → ENV), this
# lane on the command. Only the image lane had the mapping, so console.hanzo.ai —
# which serves THIS export, not the image — shipped a bundle with no key at all and
# reported nothing for signed-out views while every gate upstream read green.
site:
  slug: hanzo-console
  dir: out
  build: corepack enable && pnpm install --frozen-lockfile && NEXT_PUBLIC_PUBLISHABLE_KEY=$PUBLISHABLE_KEY pnpm build:embed
  on: [main]

# The KMS tenant this repo's build secrets come from. Stated rather than derived:
# hanzoai/ci derives it from the owner when unset, and that context var is not
# reliably populated on git.hanzo.ai, which leaves ORG empty and fails a build that
# declares build_secrets. kms.org is the documented override.
kms:
  org: hanzo
